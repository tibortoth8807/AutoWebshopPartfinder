# docker compose up --build
#   Shop: http://localhost:4200
#   API:  http://localhost:8080  (OpenAPI: /openapi/v1.json, health: /health)

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: partfinder
      POSTGRES_USER: partfinder
      POSTGRES_PASSWORD: partfinder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partfinder -d partfinder"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/PartFinder.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Catalog: "Host=db;Port=5432;Database=partfinder;Username=partfinder;Password=partfinder"
      Nhtsa__Enabled: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  pgdata:
